<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0c0c">
<title>Admin — BOLT</title>
<script>try{var t=localStorage.getItem("bolt-theme");document.documentElement.dataset.theme=t==="light"||t==="dark"?t:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 519 258'%3E%3Cpath fill='%238a8a8a' d='M503.6%2011.2%20178%2095.7C160%2093%20148%2072%20146.7%2038.2Q119.5%20148.8%2014.4%20180.2L80%20167C104%20167%20117%20190%20121%20213L123.1%20242.6C126%20218%20164%20153.2%20194%20139.4L306%2087.6Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--t:#fafafa;--m:#a3a3a3;--l:#262626;--l2:#404040;--s:#121212;--h:#1a1a1a;color-scheme:dark}
[data-theme=light]{--bg:#fff;--t:#0c0c0c;--m:#525252;--l:#e5e5e5;--l2:#d4d4d4;--s:#fafafa;--h:#f0f0f0;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:15px/1.7 Geist,system-ui,sans-serif}
a{color:inherit}
button,input,textarea,summary{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t);outline-offset:2px;border-radius:6px}
.w{width:min(1080px,calc(100% - 32px));margin:0 auto}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--l)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;min-height:60px;padding:6px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;margin-right:auto;letter-spacing:.02em}
.brand svg{width:40px;height:20px;flex:none}
.nl{text-decoration:none;color:var(--m);padding:7px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.nl:hover{background:var(--h);color:var(--t)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--l2);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px;text-decoration:none;background:none;cursor:pointer}
.btn.p{background:var(--t);color:var(--bg);border-color:var(--t)}
.btn.ic{padding:8px 10px}
.btn:disabled{opacity:.5;cursor:default}
main{flex:1;padding:48px 0 64px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
h2{font-size:20px;line-height:1.3;margin:36px 0 10px}
p{margin:0 0 12px}
.m{color:var(--m)}
.sm{font-size:13px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:12px;overflow:hidden;margin:22px 0 0}
.st div{background:var(--s);padding:12px 16px;font-size:13px;color:var(--m)}
.st b{display:block;font-size:22px;font-weight:600;line-height:1.4;color:var(--t)}
.lib{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--l)}
.sv{padding:14px 0;border-bottom:1px solid var(--l)}
.hd{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.gi{flex:1 1 240px;min-width:0}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--h);border:1px solid var(--l);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.cd{font:13px 'Geist Mono',monospace;background:var(--s);border:1px solid var(--l);border-radius:6px;padding:2px 8px;cursor:pointer;text-align:left}
.cd:hover{background:var(--h)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--m);font-size:14px;width:fit-content}
details[open]>summary{color:var(--t)}
select,input[type=text],textarea{width:100%;font-size:16px;background:var(--s);border:1px solid var(--l);border-radius:8px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
.tg{display:flex;gap:10px;align-items:center;border:1px solid var(--l);border-radius:10px;padding:12px;background:var(--s);cursor:pointer;margin:10px 0}
.tg input{width:18px;height:18px;accent-color:var(--t)}
.fm{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fm input{flex:1 1 180px;width:auto}
.err{border:1px solid var(--l2);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--s)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:13px;z-index:20}
@media(min-width:640px){.st{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.st{grid-template-columns:repeat(6,1fr)}}
@media(max-width:560px){.brand svg{width:28px;height:14px}.nl{padding:7px 8px}}
</style>
</head>
<body>
<header><div class="w bar"><a class="brand" href="./" aria-label="BOLT home"><svg viewBox="0 0 519 258" aria-hidden="true"><path fill="currentColor" d="M503.6 11.2 178 95.7C160 93 148 72 146.7 38.2Q119.5 148.8 14.4 180.2L80 167C104 167 117 190 121 213L123.1 242.6C126 218 164 153.2 194 139.4L306 87.6Z"/></svg>BOLT</a><a class="nl" href="./">Back to site</a><button id="th" class="btn ic" type="button" aria-label="Toggle theme"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button><span id="au"></span></div></header>
<main id="app"><div class="w"><p class="m">Loading…</p></div></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase?supabase.createClient('https://mygdspsqdrwqmqxearyj.supabase.co','sb_publishable_yNvT07pWq2oCtyCLCam6og_Yl2iRrfw',{auth:{flowType:'pkce'}}):null;
const $=i=>document.getElementById(i);
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v===true)e.setAttribute(n,'');else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const ava=(u,n)=>typeof u==='string'&&u.startsWith('https://cdn.discordapp.com/')?h('img',{class:'ava',src:u,alt:''}):h('span',{class:'ava'},(n||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase());
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)};
const copy=async x=>{try{await navigator.clipboard.writeText(x);toast('Copied')}catch(e){toast('Could not copy')}};
const ago=i=>{const m=Math.max(0,Math.round((Date.now()-new Date(i))/6e4));return m<1?'just now':m<60?m+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const show=n=>$('app').replaceChildren(n);
let A=null;

/* Which features a server has turned on, read from its saved settings */
const F=[['automod','Auto-mod',s=>s.enabled],['modpoints','Mod points',s=>s.kickAt||s.banAt],['modlog','Logs',s=>s.channelId||s.messageChannelId||s.memberChannelId||s.sayChannelId],['tickets','Tickets',s=>s.panelChannelId],['modmail','Mod mail',s=>s.channelId],['intro','Intro',s=>s.channelId],['welcome','Welcome',s=>s.channelId],['rolepanel','Role menu',s=>s.channelId],['levels','Levels',s=>s.enabled],['leaderboard','Leaderboard',s=>s.channelId],['suggestions','Suggestions',s=>s.channelId]];
const feats=c=>F.filter(f=>c&&c[f[0]]&&f[2](c[f[0]])).map(f=>f[1]);

async function login(){const{error}=await sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});if(error)toast('Login failed: '+error.message)}
const gate=(t,p,l)=>h('div',{class:'w'},h('h1',{},t),h('p',{class:'m'},p),l?h('button',{class:'btn p',type:'button',onclick:login},'Log in with Discord'):h('a',{class:'btn',href:'./'},'Go to BOLT'));

/* Raw settings editor: everything BOLT stores for one server */
function editor(id,r){
const ta=h('textarea',{spellcheck:'false','aria-label':'Raw settings JSON',style:'font:13px/1.5 "Geist Mono",monospace;min-height:220px'});ta.value=JSON.stringify(r?r.settings:{},null,2);
const er=h('p',{class:'err',hidden:true,role:'alert'}),bad=m=>{er.textContent=m;er.hidden=false};
const sv=h('button',{class:'btn p',type:'button',onclick:async()=>{
er.hidden=true;let v;try{v=JSON.parse(ta.value)}catch(e){return bad('This is not valid JSON: '+e.message)}
if(!v||typeof v!=='object'||Array.isArray(v))return bad('Settings must be a JSON object.');
if(!confirm('Save these settings for this server? BOLT applies them within about 20 seconds.'))return;
sv.disabled=true;
const{error}=await sb.from('guild_settings').upsert({guild_id:id,settings:v},{onConflict:'guild_id'});
sv.disabled=false;
if(error)bad('Could not save: '+error.message);else toast('Saved. BOLT applies changes within about 20 seconds.')}},'Save settings');
return h('details',{},h('summary',{},'Edit raw settings'),h('p',{class:'m sm',style:'margin:8px 0'},'Everything BOLT stores for this server. A wrong value can break a feature, so change one thing at a time.'),ta,er,h('div',{style:'margin-top:10px'},sv))}

function row(g,r,mc,bl,pend){
const by=!r||!r.updated_by?'':r.updated_by===A?' by you':r.updated_by==='bot'?' by the bot':' by Discord ID '+r.updated_by,on=feats(r&&r.settings);
const blockBtn=bl?h('button',{class:'btn',type:'button',onclick:()=>run(sb.from('blocked_guilds').delete().eq('guild_id',g.guild_id),'Unblocked.')},'Unblock'):h('button',{class:'btn',type:'button',onclick:()=>{const why=prompt('Block '+g.name+' from using BOLT? BOLT will leave and will not stay. Reason (optional):');if(why===null)return;run(sb.from('blocked_guilds').insert({guild_id:g.guild_id,name:g.name,reason:why.trim().slice(0,300)||null}),'Blocked. BOLT leaves within about 20 seconds.')}},'Block');
const leaveBtn=pend?h('span',{class:'m sm'},'Leave requested'):h('button',{class:'btn',type:'button',onclick:()=>{if(!confirm('Make BOLT leave '+g.name+'? Its members lose BOLT until someone adds it again.'))return;run(sb.from('bot_actions').insert({action:'leave_guild',guild_id:g.guild_id,guild_name:g.name}),'Leave requested. BOLT acts within about 20 seconds.')}},'Make BOLT leave');
const clr=(w,label)=>h('button',{class:'btn',type:'button',onclick:()=>{if(!confirm('Clear all '+label+' in '+g.name+'? This cannot be undone.'))return;run(sb.from('bot_actions').insert({action:'clear_data',guild_id:g.guild_id,guild_name:g.name,payload:{what:w}}),'Clear requested. BOLT acts within about 20 seconds.')}},'Clear '+label);
const cnt=h('p',{class:'m sm',style:'margin:8px 0'},'Deletes it for every member of this server. This cannot be undone.');
const dat=h('details',{},h('summary',{},'Clear server data'),cnt,h('div',{class:'fm'},clr('points','mod points'),clr('warnings','warnings'),clr('levels','levels')));
dat.addEventListener('toggle',async()=>{if(!dat.open)return;cnt.textContent='Counting…';const c=t=>sb.from(t).select('*',{count:'exact',head:true}).eq('guild_id',g.guild_id);const[a,b,l]=await Promise.all([c('mod_points'),c('warnings'),c('levels')]);cnt.textContent=a.error||b.error||l.error?'Could not count.':(a.count||0)+' members with mod points, '+(b.count||0)+' warnings, '+(l.count||0)+' levelled members. Clearing cannot be undone.'});
return h('li',{class:'sv','data-q':(g.name+' '+g.guild_id).toLowerCase()},
h('div',{class:'hd'},ava(g.icon,g.name),
h('div',{class:'gi'},h('strong',{},g.name),
h('div',{class:'m sm'},mc+' managers, '+g.channels.length+' channels, '+g.roles.length+' roles. Synced '+ago(g.updated_at)+'.'),
h('div',{class:'m sm'},(on.length?'On: '+on.join(', ')+'. ':'No features on. ')+(r?'Settings changed '+ago(r.updated_at)+by+'.':'Settings never saved.')),bl&&h('div',{class:'m sm'},'Blocked '+ago(bl.blocked_at)+(bl.reason?': '+bl.reason:'.'))),
h('button',{class:'cd',type:'button',title:'Copy server ID',onclick:()=>copy(g.guild_id)},g.guild_id),
h('a',{class:'btn',href:'./#/dashboard/'+g.guild_id+'/overview'},'Open settings'),blockBtn,leaveBtn),
editor(g.guild_id,r),dat)}

const what=a=>a.action==='leave_guild'?'Leave '+(a.guild_name||a.guild_id):a.action==='clear_data'?'Clear '+((a.payload||{}).what||'data')+' in '+(a.guild_name||a.guild_id):'Announcement to '+(a.guild_id?(a.guild_name||a.guild_id):'all servers');
const run=async(p,ok)=>{const{error}=await p;if(error)return toast(error.code==='23505'?'That ID is already blocked.':'Could not save: '+error.message);toast(ok);render()};
function controls(c,bl,ac,bu,gs){
const on=h('input',{type:'checkbox'});on.checked=c.bot_enabled;
const msg=h('input',{type:'text',maxlength:'200',placeholder:'Message shown when BOLT is off (optional)','aria-label':'Message shown when BOLT is off'});msg.value=c.message||'';
const idf=h('input',{type:'text',inputmode:'numeric',placeholder:'Server ID','aria-label':'Server ID to block'}),why=h('input',{type:'text',maxlength:'300',placeholder:'Reason (optional)','aria-label':'Reason for blocking'});
const uid=h('input',{type:'text',inputmode:'numeric',placeholder:'User ID','aria-label':'User ID to block'}),uwhy=h('input',{type:'text',maxlength:'300',placeholder:'Reason (optional)','aria-label':'Reason for blocking'});
const asel=h('select',{'aria-label':'Where to send'},h('option',{value:''},'All servers ('+gs.length+')'),gs.map(x=>h('option',{value:x.guild_id},x.name)));
const atx=h('textarea',{maxlength:'1500',placeholder:'Announcement text','aria-label':'Announcement text',style:'margin-top:8px'});
return h('div',{},h('h2',{},'Controls'),
h('p',{class:'m sm'},c.bot_seen_at?'BOLT last checked these switches '+ago(c.bot_seen_at)+'.':'BOLT has not read these switches yet. The bot needs the update that reads them.'),
h('label',{class:'tg'},on,'BOLT is on. When this is off, BOLT stays online but ignores commands and does nothing in every server.'),
h('div',{class:'fm'},msg,h('button',{class:'btn p',type:'button',onclick:()=>run(sb.from('bot_control').update({bot_enabled:on.checked,message:msg.value.trim()||null}).eq('id',1),on.checked?'BOLT is on.':'BOLT is off.')},'Save')),
h('h2',{},'Blocked servers'),
h('p',{class:'m sm'},'BOLT leaves a blocked server and leaves again if someone adds it back.'),
h('div',{class:'fm'},idf,why,h('button',{class:'btn p',type:'button',onclick:()=>{const id=idf.value.trim();if(!/^\d{17,20}$/.test(id))return toast('Enter a server ID with 17 to 20 digits.');run(sb.from('blocked_guilds').insert({guild_id:id,reason:why.value.trim()||null}),'Blocked. BOLT leaves within about 20 seconds.')}},'Block server')),
bl.length?h('ul',{class:'lib'},bl.map(b=>h('li',{class:'sv'},h('div',{class:'hd'},h('div',{class:'gi'},h('strong',{},b.name||b.guild_id),h('div',{class:'m sm'},b.guild_id+'. Blocked '+ago(b.blocked_at)+(b.reason?': '+b.reason:'.'))),h('button',{class:'btn',type:'button',onclick:()=>run(sb.from('blocked_guilds').delete().eq('guild_id',b.guild_id),'Unblocked.')},'Unblock'))))):h('p',{class:'m sm'},'No blocked servers.'),
h('h2',{},'Blocked users'),
h('p',{class:'m sm'},'BOLT ignores a blocked user in every server.'),
h('div',{class:'fm'},uid,uwhy,h('button',{class:'btn p',type:'button',onclick:()=>{const id=uid.value.trim();if(!/^\d{17,20}$/.test(id))return toast('Enter a user ID with 17 to 20 digits.');run(sb.from('blocked_users').insert({user_id:id,reason:uwhy.value.trim()||null}),'User blocked.')}},'Block user')),
bu.length?h('ul',{class:'lib'},bu.map(b=>h('li',{class:'sv'},h('div',{class:'hd'},h('div',{class:'gi'},h('strong',{},b.name||b.user_id),h('div',{class:'m sm'},b.user_id+'. Blocked '+ago(b.blocked_at)+(b.reason?': '+b.reason:'.'))),h('button',{class:'btn',type:'button',onclick:()=>run(sb.from('blocked_users').delete().eq('user_id',b.user_id),'Unblocked.')},'Unblock'))))):h('p',{class:'m sm'},'No blocked users.'),
h('h2',{},'Announcement'),
h('p',{class:'m sm'},'BOLT posts this in every server, or only the one you pick.'),
asel,atx,
h('div',{style:'margin-top:10px'},h('button',{class:'btn p',type:'button',onclick:()=>{const t=atx.value.trim();if(!t)return toast('Write the announcement first.');const w=asel.value?asel.selectedOptions[0].text:'all '+gs.length+' servers';if(!confirm('Send this announcement to '+w+'?'))return;run(sb.from('bot_actions').insert({action:'announce',guild_id:asel.value||null,guild_name:asel.value?asel.selectedOptions[0].text:null,payload:{message:t}}),'Announcement queued. BOLT sends it within about 20 seconds.')}},'Send announcement')),
h('h2',{},'Recent actions'),
ac.length?h('ul',{class:'lib'},ac.map(a=>h('li',{class:'sv m sm'},what(a)+': '+a.status+(a.result?' ('+a.result+')':'')+'. '+ago(a.created_at)+'.'))):h('p',{class:'m sm'},'Nothing yet.'))}

async function render(){
const{data:{session}}=await sb.auth.getSession();
$('au').replaceChildren(session?h('button',{class:'btn',type:'button',onclick:async()=>{await sb.auth.signOut();A=null;render()}},'Log out'):h('button',{class:'btn p',type:'button',onclick:login},'Log in'));
if(!session)return show(gate('Log in to continue','Connect with Discord to open this page.',1));
try{
if(!A){const{data,error}=await sb.from('bot_admins').select('discord_id').limit(1);if(error)throw error;A=data&&data.length?data[0].discord_id:null}
if(!A)return show(gate('Page not found','This page does not exist.'));
const q=t=>sb.from(t).select('*',{count:'exact',head:true});
const R=await Promise.all([sb.from('guild_meta').select('guild_id,name,icon,channels,roles,updated_at').order('name'),sb.from('guild_settings').select('guild_id,settings,updated_at,updated_by'),sb.from('guild_managers').select('guild_id'),q('mod_points'),q('mod_point_log'),q('warnings'),q('levels'),sb.from('bot_control').select('bot_enabled,message,bot_seen_at').eq('id',1).maybeSingle(),sb.from('blocked_guilds').select('*').order('blocked_at',{ascending:false}),sb.from('bot_actions').select('*').order('created_at',{ascending:false}).limit(12),sb.from('blocked_users').select('*').order('blocked_at',{ascending:false})]);
for(const x of R)if(x.error)throw x.error;
const[g,st,mg,...n]=R,S={},M={},BL={},PN={};
st.data.forEach(r=>S[r.guild_id]=r);mg.data.forEach(r=>M[r.guild_id]=(M[r.guild_id]||0)+1);n[5].data.forEach(b=>BL[b.guild_id]=b);n[6].data.forEach(a=>{if(a.status==='pending')PN[a.guild_id]=1});
const list=h('ul',{class:'lib'},g.data.map(x=>row(x,S[x.guild_id],M[x.guild_id]||0,BL[x.guild_id],PN[x.guild_id])));
const f=h('input',{type:'text',placeholder:'Search servers by name or ID','aria-label':'Search servers'});
f.oninput=()=>{const v=f.value.trim().toLowerCase();for(const li of list.children)li.hidden=!!v&&!li.dataset.q.includes(v)};
show(h('div',{class:'w'},h('h1',{},'Admin'),
h('p',{class:'m',style:'max-width:60ch'},'Open or change any server that has BOLT. Changes reach BOLT in about 20 seconds.'),
h('div',{class:'st'},[['Servers',g.data.length],['Managers',mg.data.length],['Mod points',n[0].count],['Point log',n[1].count],['Warnings',n[2].count],['Levels',n[3].count]].map(s=>h('div',{},h('b',{},String(s[1]||0)),s[0]))),
controls(n[4].data||{bot_enabled:true},n[5].data,n[6].data,n[7].data,g.data),h('h2',{},'Servers'),f,
g.data.length?list:h('p',{class:'m',style:'margin-top:12px'},'No servers yet. A server appears here after BOLT joins it.'),
h('p',{class:'m sm',style:'margin-top:24px'},'The database enforces access. Only Discord accounts on the bot_admins list can load this data.')))
}catch(e){show(h('div',{class:'w'},h('p',{class:'err'},'Could not load admin data: '+e.message)))}}

const theme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('bolt-theme',t)}catch(e){}};
$('th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
(async()=>{
if(!sb)return show(h('div',{class:'w'},h('p',{class:'err'},'Could not load the login library. Check your connection and reload.')));
try{await sb.auth.getSession()}catch(e){}
if(location.search.includes('code='))history.replaceState(null,'',location.pathname);
render()})();
</script>
</body>
</html>
