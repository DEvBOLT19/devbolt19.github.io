['automod','automod','Auto-mod','Remove invites, spam, mass mentions and blocked words.',0,[['enabled','t','Turn on auto-mod'],['invites','t','Block invite links'],['mentionLimit','n','Remove messages with this many mentions (0 = off)'],['spamLimit','n','Spam: remove when someone sends this many messages (0 = off)'],['spamSeconds','n','Spam time window in seconds',8],['words','a','Blocked words (separate with commas)',1000],['muteMinutes','n','Mute offenders for this many minutes (0 = off)'],['exemptRoleIds','R','Roles that are never checked (up to 10)']]],

['announcements','announcements','Announcements','Where BOLT shows news and updates from its developer.',0,[['channelId','c','Announcements channel','Not set']]]
];
function unpack(x,s){const d={};if(x[4])d.on=!!s.channelId;
for(const f of x[5]){const k=f[0],t=f[1],v=s[k];
d[k]=t==='t'?!!v:t==='n'?Number(v)||f[3]||0:t==='R'?(Array.isArray(v)?v.slice():[]):t==='D'?(Number.isInteger(v)?v:0):t==='H'?(Number.isInteger(v)?v:18):t==='L'?Array.from({length:5},(_,i)=>{const r=(v||[])[i]||{};return{level:Number(r.level)||0,roleId:r.roleId||''}}):k==='words'?(Array.isArray(v)?v.join(', '):''):(v||'')}
return d}
function pack(x,d){const o={};
for(const f of x[5]){const k=f[0],t=f[1],v=d[k];
o[k]=t==='t'?!!v:t==='n'?v||f[3]||0:t==='c'||t==='r'?v||null:t==='L'?v.filter(r=>r.level>=1&&r.roleId).map(r=>({level:r.level,roleId:r.roleId})):t==='s'||t==='a'?(k==='words'?v.split(',').map(w=>w.trim().toLowerCase()).filter(Boolean).slice(0,50):v.trim()):v}
if(x[4]&&!d.on){o.channelId=null;if(x[1]==='intro')o.template=null}
if(x[1]==='modmail'){o.createChannel=!!(d.on&&!d.channelId&&d.create);delete o.create}
if(x[1]==='leaderboard')o.tzOffset=-new Date().getTimezoneOffset();
if(x[1]==='tickets')o.categoryId=null;
return o}

async user(){try{const{data:{session}}=await sb.auth.getSession();if(!session)return null;const m=session.user.user_metadata||{};return{name:m.full_name||m.name||'You',avatar:m.avatar_url}}catch(e){return null}},
async login(){try{sessionStorage.setItem('bolt-return',location.hash||'#/dashboard')}catch(e){}const{error}=await sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});if(error)throw error},
async logout(){await sb.auth.signOut();this.g=null;S.id=null},
async guilds(){if(this.g&&Date.now()-this.t<3e5)return this.g;const{data,error}=await sb.from('guild_meta').select('guild_id,name,icon,channels,roles,updated_at').order('name');if(error)throw error;this.g=data;this.t=Date.now();return data},
async raw(id){const{data,error}=await sb.from('guild_settings').select('settings').eq('guild_id',id).maybeSingle();if(error)throw error;return(data&&data.settings)||{}},
async save(id,d){const s={...await this.raw(id)};for(const x of SEC)s[x[1]]=pack(x,d[x[0]]);const{error}=await sb.from('guild_settings').upsert({guild_id:id,settings:s},{onConflict:'guild_id'});if(error)throw error}
};

/* Router, theme, boot */
let tok=0;
async function nav(a){const u=await D.user();

async function render(keep){
